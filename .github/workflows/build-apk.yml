name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install -g @angular/cli @ionic/cli @capacitor/cli

      - name: Build the app
        run: |
          if [ -f "angular.json" ]; then
            npx ng build --configuration=production || npx ng build
          elif [ -f "ionic.config.json" ]; then
            npx ionic build --prod
          else
            npm run build || npx vite build || echo "Trying alternative build..."
            npm run build --if-present
          fi

      - name: List output folders
        run: |
          ls -la
          ls -la www || true
          ls -la dist || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
