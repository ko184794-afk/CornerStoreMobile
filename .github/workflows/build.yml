name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npm install -g @angular/cli @capacitor/cli

      - name: Build web app (force output)
        run: |
          # Try multiple ways to build
          npx ng build --configuration=production --output-path=www || \
          npx ng build --output-path=www || \
          npx ng build || \
          npm run build --if-present

          echo "===== AFTER BUILD ====="
          find . -name "index.html" -not -path "./node_modules/*" | head -20
          ls -la
          ls -la www || true
          ls -la dist || true

      - name: Force create www with index.html
        run: |
          rm -rf www
          mkdir -p www

          # Copy from wherever index.html is
          INDEX=$(find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" | head -1)
          
          if [ -z "$INDEX" ]; then
            echo "ERROR: No index.html found after build"
            echo "Listing all files:"
            find . -type f -not -path "./node_modules/*" | head -50
            exit 1
          fi

          echo "Found index.html at: $INDEX"
          DIR=$(dirname "$INDEX")
          echo "Copying from: $DIR"
          cp -r "$DIR"/* www/

          echo "===== www contents ====="
          ls -la www

          if [ ! -f "www/index.html" ]; then
            echo "Failed to copy index.html"
            exit 1
          fi

          echo "SUCCESS: www/index.html exists"

      - name: Create capacitor config
        run: |
          cat > capacitor.config.json << EOF
          {
            "appId": "com.lumierescents.app",
            "appName": "LumiereScents",
            "webDir": "www"
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
