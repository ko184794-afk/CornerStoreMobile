name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npm install -g @angular/cli @capacitor/cli

      - name: Build web app
        run: |
          npx ng build --configuration=production || npx ng build || npm run build --if-present

      - name: Prepare www folder
        run: |
          echo "=== Current directory structure ==="
          find . -name "index.html" -not -path "./node_modules/*" | head -10

          # Remove old www if exists
          rm -rf www
          mkdir -p www

          # Try common output locations
          if [ -d "dist" ]; then
            echo "Found dist folder"
            # Angular 17+ often uses dist/project-name/browser
            if [ -d "dist" ] && [ -f "dist/index.html" ]; then
              cp -r dist/* www/
            else
              # Find the browser folder
              BROWSER_DIR=$(find dist -type d -name "browser" | head -1)
              if [ -n "$BROWSER_DIR" ]; then
                echo "Found browser dir: $BROWSER_DIR"
                cp -r "$BROWSER_DIR"/* www/
              else
                # Copy everything from the first subfolder of dist
                FIRST_DIR=$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)
                if [ -n "$FIRST_DIR" ]; then
                  cp -r "$FIRST_DIR"/* www/ || cp -r "$FIRST_DIR"/browser/* www/ || true
                fi
              fi
            fi
          fi

          echo "=== Contents of www ==="
          ls -la www

          if [ ! -f "www/index.html" ]; then
            echo "Still no index.html, searching again..."
            INDEX=$(find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" | head -1)
            if [ -n "$INDEX" ]; then
              echo "Found at: $INDEX"
              DIR=$(dirname "$INDEX")
              cp -r "$DIR"/* www/
            fi
          fi

          ls -la www
          test -f www/index.html && echo "SUCCESS: index.html exists" || echo "FAILED: still no index.html"

      - name: Create capacitor config
        run: |
          cat > capacitor.config.json << EOF
          {
            "appId": "com.lumierescents.app",
            "appName": "LumiereScents",
            "webDir": "www"
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
